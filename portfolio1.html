<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #1f2937;
      padding: 20px;
      color: white;
    }

    h1 {
      margin-top: 30px;
      font-size: 36px;
      color: #1e40af;
    }

    .button-container {
      margin-top: 40px;
    }

    .download-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .download-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <header>
    <h2>My Portfolio</h2>
  </header>

  <h1>Welcome to My Portfolio</h1>
  <p>Explore my work and download my CV below.</p>

  <div class="button-container">
    <a href="cv/my_cv.pdf" download>
      <button class="download-btn">Download CV</button>
    </a>
  </div>

</body>
</html>
